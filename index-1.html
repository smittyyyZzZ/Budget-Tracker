.bt{--ink:#0F2A2E;--paper:#E8F0EF;--card:#F8FBFA;--line:#C5D4D0;--mute:#587074;--gold:#E8B200;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:var(--paper);min-height:100vh;box-sizing:border-box}
.bt *{box-sizing:border-box}
.bt .pad{max-width:560px;margin:0 auto;padding:20px 16px 120px}
.bt h1{font-size:15px;font-weight:600;margin:0 0 6px;color:var(--mute)}
.bt .big{font-size:30px;font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.bt .sub{font-size:14px;color:var(--mute);margin-top:4px}
.bt .bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bt .bar>i{display:block;height:100%;border-radius:99px;transition:width .4s}
.bt .bar.stack{display:flex}
.bt .bar.stack>i{border-radius:0}
.bt button:focus-visible,.bt input:focus-visible,.bt textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.bt .hero{background:var(--ink);color:#fff;border-radius:24px;padding:20px}
.bt .herotop{display:flex;gap:18px;align-items:center}
.bt .hero h1{color:rgba(255,255,255,.7)}
.bt .hero .sub{color:rgba(255,255,255,.72)}
.bt .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.bt .stats>div{background:rgba(255,255,255,.09);border-radius:14px;padding:10px 12px;min-width:0}
.bt .stats small{display:block;font-size:12px;color:rgba(255,255,255,.66);margin-bottom:2px}
.bt .stats b{font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bt .ringc{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}

.bt .st{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 2px}
.bt .st h2{font-size:18px;font-weight:800;margin:0}
.bt .st span{font-size:13px;color:var(--mute)}
.bt .grow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line);padding:14px 2px;cursor:pointer;font:inherit;color:inherit}
.bt .info{flex:1;min-width:0}
.bt .name{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.bt .meta{font-size:13px;color:var(--mute);margin-top:3px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bt .panel{background:var(--card);border-radius:18px;padding:14px;margin-top:10px}
.bt .panel h3{margin:0 0 4px;font-size:16px;font-weight:800}
.bt .alert{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:8px;padding:12px 14px;
  border:0;border-left:5px solid var(--gold);border-radius:6px 14px 14px 6px;background:var(--card);font:inherit;color:inherit;cursor:pointer}
.bt .alert.urgent{border-left-color:#C0392B}
.bt .alert .amt{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

.bt .btn{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer}
.bt .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.bt .btn.danger{background:transparent;color:${Rt};border:1.5px solid ${Rt}}
.bt .btn.full{width:100%}
.bt .mini{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:6px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.bt .mini.danger{color:${Rt};border-color:${Rt}}
.bt .mini.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.bt input[type=text],.bt input[type=date]{width:100%;font:inherit;padding:12px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--card);color:var(--ink)}
.bt input.amtin{font-size:28px;font-weight:800;padding:14px 12px;font-variant-numeric:tabular-nums}
.bt .ta{width:100%;font:inherit;font-size:12px;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);resize:vertical}
.bt label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
.bt .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.bt .chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.bt .chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.bt .swrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bt .sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;flex:none}
.bt .sw.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--paper)}
.bt input[type=color]{width:34px;height:34px;padding:0;border:0;background:none;cursor:pointer;border-radius:50%;flex:none}
.bt .seg{display:flex;background:#D5E2DF;border-radius:14px;padding:4px;gap:4px;margin:14px 0 4px}
.bt .seg button{flex:1;border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:700;color:var(--mute);padding:9px 0;border-radius:11px;cursor:pointer;white-space:nowrap}
.bt .seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,42,46,.18)}
.bt .mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.bt .mnav b{font-size:18px;font-weight:800;text-transform:capitalize}
.bt .mnav button{background:var(--card);border:0;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}

.bt .back{display:flex;align-items:center;gap:6px;background:none;border:0;font:inherit;font-weight:600;color:var(--mute);cursor:pointer;padding:0 0 14px}
.bt .sec{margin-top:26px}
.bt .sec h2{font-size:17px;font-weight:800;margin:0 0 10px}
.bt .item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.bt .item .tx{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}
.bt .item .tx small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.bt .item .amt{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;text-align:right}
.bt .done .tx{text-decoration:line-through;color:var(--mute)}
.bt .ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink);background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;padding:0;color:#fff}
.bt .ck.on{background:var(--ink)}
.bt .x{background:none;border:0;color:var(--mute);cursor:pointer;padding:4px;display:grid;place-items:center;flex:none}
.bt .two{display:flex;gap:8px}
.bt .two>*{flex:1}
.bt .pair{display:flex;gap:6px;flex:none}
.bt .empty{padding:36px 8px;text-align:center;color:var(--mute)}
.bt .empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}
.bt .hint{background:var(--card);border-left:4px solid var(--gold);padding:10px 12px;border-radius:0 10px 10px 0;font-size:14px;margin-top:14px}
.bt .setrow{padding:14px 0;border-bottom:1px solid var(--line)}
.bt .setrow .nm{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:10px}
.bt .dot{width:12px;height:12px;border-radius:50%;flex:none}
.bt .day{font-size:13px;font-weight:700;color:var(--mute);margin:20px 0 2px;text-transform:capitalize}
.bt .badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--ink)}
.bt .badge.ok{background:#CDEBDD;color:#14603C}
.bt .badge.warn{background:#FBE7B0;color:#7A5600}
.bt .badge.bad{background:#F6D2CD;color:#9A2A20}
.bt .menu{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:0;border-radius:18px;
  padding:14px 16px;margin-top:10px;font:inherit;color:inherit;cursor:pointer}
.bt .menu .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.bt .menu b{display:block;font-size:16px}
.bt .menu span{font-size:13px;color:var(--mute)}
.bt .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mute);margin:2px 4px 6px}
.bt .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bt .step{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.bt .step .num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;background:var(--line);color:var(--ink)}
.bt .step.now .num{background:var(--gold)}
.bt .step.fin .num{background:var(--ink);color:#fff}
.bt .step h3{margin:0;font-size:17px;font-weight:800}
.bt .step p{margin:4px 0 8px;font-size:14px;color:var(--mute);line-height:1.45}

.bt .nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:10}
.bt .nav .in{max-width:560px;margin:0 auto;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bt .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;
  font:inherit;font-size:11.5px;font-weight:600;color:var(--mute);padding:4px 0;cursor:pointer;border-radius:12px}
.bt .nav button .pill{padding:4px 14px;border-radius:99px;display:grid;place-items:center}
.bt .nav button[aria-current=page]{color:var(--ink)}
.bt .nav button[aria-current=page] .pill{background:var(--gold)}
.bt .nav button.mid .pill{background:var(--ink);color:#fff;padding:6px 18px}
.bt .nav button.mid[aria-current=page] .pill{box-shadow:0 0 0 3px var(--gold)}
@media (prefers-reduced-motion:reduce){.bt .bar>i{transition:none}}
